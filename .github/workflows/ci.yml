name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend · Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The RBAC integration tests (tests/test_rbac_visibility.py) drive the
      # real app against a real database — the schema uses Postgres enums,
      # to_char and a trigram index, so SQLite cannot stand in. Without these
      # services those tests skip rather than fail, which would let an
      # authorisation regression through unnoticed; the "assert no skips" step
      # below is what stops that happening quietly.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: partner_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # get_current_user checks a token blacklist in Redis on every
        # authenticated request, so the integration tests need it too.
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert the test database is reachable
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/partner_portal_test
        # The integration tests skip themselves when no database is reachable.
        # That is right on a developer machine and wrong here: a service
        # container that failed to come up would turn the whole authorisation
        # suite into green skips. Fail loudly instead, before pytest runs.
        run: |
          python -c "
          import sys
          from tests.conftest import db_available
          if not db_available():
              sys.exit('Test database unreachable — the integration suite would skip.')
          print('Test database reachable.')
          "

      - name: Run pytest
        env:
          # conftest.py overrides DATABASE_URL with TEST_DATABASE_URL before
          # anything imports app.core.config, so the app can only ever reach
          # the throwaway service above.
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/partner_portal_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/partner_portal_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key-min-32-chars-aaaaaaa
          SUPERADMIN_EMAIL: ci@example.com
          SUPERADMIN_PASSWORD: ci-password
          AI_ENABLED: 'false'
          GROQ_API_KEY: ''
        run: pytest -v

  frontend-build:
    name: Frontend · Lint, TypeCheck, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
